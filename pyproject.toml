[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-rag-agent"
version = "0.1.0"
description = "RAG Knowledge Assistant for Fund/TFSA/RRSP information"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "google-genai>=0.4.0",
    "google-cloud-aiplatform>=1.40.0",
    "google-cloud-discoveryengine>=0.11.0",
    "google-cloud-storage>=2.14.0",
    "langchain>=0.1.0",
    "langchain-google-genai>=0.0.6",
    "langchain-google-vertexai>=0.0.6",
    "matplotlib>=3.8.2",
    "numpy>=1.26.3",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
